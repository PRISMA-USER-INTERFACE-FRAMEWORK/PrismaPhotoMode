[General]
; Virtual-key codes. ToggleKey enters or leaves photo mode (gameplay only).
; FocusKey gives the panel the mouse and keyboard, or releases them back to the camera.
ToggleKey=120
FocusKey=9
; Gamepad button code that gives or releases the panel. 65568 is Back (0x10020), 0 disables it.
FocusPadButton=65568
; Panel size in percent, 50 to 200.
PanelScale=100
